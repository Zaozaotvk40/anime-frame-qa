[project]
name = "anime-frame-qa"
version = "0.1.0"
description = "Quality assurance pipeline for AI-generated anime frames"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-contrib-python-headless>=4.9",
    "numpy>=1.26",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cnn = [
    "rembg[cpu]>=2.0",
    "simple-lama-inpainting>=0.1.0",
]
wandb = [
    "wandb>=0.16",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
# rembg pulls in opencv-python as a transitive dependency, which overwrites
# opencv-contrib-python-headless and breaks ximgproc (Zhang-Suen thinning).
# Override to ensure the contrib version is always used.
override-dependencies = [
    "opencv-python>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_frame_qa"]

[project.scripts]
pipeline = "anime_frame_qa.cli:main"
