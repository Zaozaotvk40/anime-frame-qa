[project]
name = "anime-frame-qa"
version = "0.1.0"
description = "Quality assurance pipeline for AI-generated anime frames"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "click>=8.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_frame_qa"]

[project.scripts]
pipeline = "anime_frame_qa.cli:main"
